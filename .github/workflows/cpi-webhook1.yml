name: Send GitHub Event to SAP CPI

on:
  push:
  issues:
  pull_request:

jobs:
  send-to-cpi:
    runs-on: ubuntu-latest

    steps:
      - name: Send GitHub event to SAP CPI
        env:
          CPI_CLIENT_ID: ${{ secrets.CPI_CLIENT_ID }}
          CPI_CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}
        run: |
          curl -sS -X POST \
            -u "$CPI_CLIENT_ID:$CPI_CLIENT_SECRET" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${{ github.event_name }}" \
            -d '${{ toJson(github.event) }}' \
            -o response.txt \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            "https://9ece3a36trial.it-cpitrial06-rt.cfapps.us10-001.hana.ondemand.com/http/github/webhook"

          echo "CPI RESPONSE:"
          cat response.txt
